<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Frog PDF: frog peeking over a document -->
  <rect width="512" height="512" rx="112" fill="#1d5e3a"/>
  <!-- document -->
  <g transform="rotate(-6 256 380)">
    <path d="M136 268h204l44 44v170H136z" fill="#ffffff"/>
    <path d="M340 268v44h44z" fill="#cfe3d6"/>
    <rect x="164" y="388" width="190" height="12" rx="6" fill="#c7d2cb"/>
    <rect x="164" y="410" width="120" height="12" rx="6" fill="#c7d2cb"/>
    <text x="164" y="466" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="44" fill="#e0443e">PDF</text>
  </g>
  <!-- head -->
  <ellipse cx="256" cy="262" rx="176" ry="118" fill="#5cc85a"/>
  <!-- eye bumps -->
  <circle cx="170" cy="168" r="70" fill="#5cc85a"/>
  <circle cx="342" cy="168" r="70" fill="#5cc85a"/>
  <!-- eyes -->
  <circle cx="170" cy="164" r="46" fill="#ffffff"/>
  <circle cx="342" cy="164" r="46" fill="#ffffff"/>
  <circle cx="180" cy="172" r="24" fill="#16241b"/>
  <circle cx="332" cy="172" r="24" fill="#16241b"/>
  <circle cx="188" cy="163" r="8" fill="#ffffff"/>
  <circle cx="340" cy="163" r="8" fill="#ffffff"/>
  <!-- nostrils, cheeks, smile -->
  <circle cx="236" cy="236" r="6" fill="#2f7d3a"/>
  <circle cx="276" cy="236" r="6" fill="#2f7d3a"/>
  <ellipse cx="128" cy="276" rx="30" ry="18" fill="#ff8fa3" opacity=".7"/>
  <ellipse cx="384" cy="276" rx="30" ry="18" fill="#ff8fa3" opacity=".7"/>
  <path d="M168 270q88 70 176 0" fill="none" stroke="#1e4d2b" stroke-width="14" stroke-linecap="round"/>
  <!-- hands gripping the page -->
  <ellipse cx="162" cy="352" rx="40" ry="24" fill="#4fb24e"/>
  <ellipse cx="350" cy="352" rx="40" ry="24" fill="#4fb24e"/>
</svg>
