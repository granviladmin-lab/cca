<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>The Pines HC Scheduling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
*{box-sizing:border-box}
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --surface-2:#E8ECF1; --ink:#0E1822; --ink-2:#4A5866; --line:#D5DCE3;
  --accent:#1F6F5C; --accent-ink:#FFFFFF; --accent-soft:#D7EEE7; --amber:#B9730A; --ok:#16935B; --crit:#C9392F; --crit-soft:#FBE3E1; --ok-soft:#DDF3E8;
  --weekend:#EEF1F5; --today:#FFF6D9;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1118; --surface:#121B25; --surface-2:#18232F; --ink:#E8EEF4; --ink-2:#98A7B6; --line:#243241;
    --accent:#4FC3A1; --accent-ink:#0B1118; --accent-soft:#163A31; --amber:#F2B03E; --ok:#3CC98A; --crit:#FF6B5E; --crit-soft:#3A1A18; --ok-soft:#123326;
    --weekend:#151F2A; --today:#2E2A14;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1118; --surface:#121B25; --surface-2:#18232F; --ink:#E8EEF4; --ink-2:#98A7B6; --line:#243241;
  --accent:#4FC3A1; --accent-ink:#0B1118; --accent-soft:#163A31; --amber:#F2B03E; --ok:#3CC98A; --crit:#FF6B5E; --crit-soft:#3A1A18; --ok-soft:#123326;
  --weekend:#151F2A; --today:#2E2A14;
}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.muted{color:var(--ink-2)}
.hidden{display:none !important}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* Lock screen */
#lock{min-height:100vh;display:grid;place-items:center;padding:16px}
#lock form{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px;width:min(400px,100%);display:grid;gap:14px}
#lock .mark{width:52px;height:52px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
#lock .err{color:var(--crit);min-height:1.2em;margin:0}

/* App shell */
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header.top h1{font-size:19px;display:flex;align-items:center;gap:10px}
header.top h1 .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-weight:500}
nav.tabs button.on{background:var(--accent-soft);color:var(--ink)}
.sync{font-size:13px;display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.sync .dot{width:9px;height:9px;border-radius:50%;background:var(--ink-2)}
.sync.ok .dot{background:var(--ok)}
.sync.busy .dot{background:var(--amber)}
.sync.bad .dot{background:var(--crit)}
main{padding:16px;max-width:100%}
.view{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h2{font-size:17px;margin-bottom:10px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar h2{font-size:18px;margin-right:6px}
.banner{border-radius:var(--r);padding:10px 14px;background:var(--accent-soft)}
.banner.warn{background:var(--crit-soft)}

/* Schedule grid */
.gridwrap{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);max-height:calc(100vh - 190px)}
table.grid{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
table.grid th,table.grid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;text-align:center;white-space:nowrap}
table.grid thead th{position:sticky;top:0;background:var(--surface);z-index:3;padding:6px 4px;font-weight:600}
table.grid thead th .dow{display:block;font-size:11px;color:var(--ink-2);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
table.grid .name{position:sticky;left:0;background:var(--surface);z-index:2;text-align:left;padding:4px 10px;min-width:190px;max-width:240px;overflow:hidden;text-overflow:ellipsis}
table.grid thead .name{z-index:4}
table.grid .name small{color:var(--ink-2);margin-left:6px}
table.grid .tot{padding:4px 8px;font-family:var(--mono);font-size:12px;width:84px;min-width:84px}
table.grid .tot.ot{color:var(--crit);font-weight:700}
table.grid tr.group td{background:var(--surface-2);text-align:left;padding:5px 10px;font-weight:600;font-size:12px;letter-spacing:.04em;text-transform:uppercase;position:sticky;left:0}
table.grid td.c{min-width:46px;height:34px;cursor:pointer;position:relative;font-family:var(--mono);font-weight:700;font-size:12px}
table.grid td.c.ro{cursor:default}
table.grid .we{background:var(--weekend)}
table.grid .td{background:var(--today)}
table.grid td.c:focus{outline:2px solid var(--accent);outline-offset:-2px;z-index:1}
td.c .chip{display:inline-block;min-width:34px;padding:3px 4px;border-radius:6px;color:#fff}
td.c .chip.off{background:none;color:var(--ink-2);font-weight:500}
td.c .chip.pto{background:#7A8794}
td.c .chip.co{background:none;color:var(--crit);border:1.5px dashed var(--crit)}
td.c .req{position:absolute;top:2px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--amber)}
td.c .warn{position:absolute;bottom:1px;right:2px;font-size:10px;color:var(--crit);font-family:var(--body)}
td.c .float{position:absolute;bottom:1px;left:3px;font-size:9px;color:var(--ink-2);font-family:var(--body)}
td.c .note{position:absolute;top:1px;left:3px;font-size:9px;color:var(--ink-2)}
table.grid tfoot td{background:var(--surface);font-family:var(--mono);font-size:12px;padding:4px 2px}
table.grid tfoot td.name{font-family:var(--body);font-size:12px}
table.grid tfoot tr:first-child td{border-top:2px solid var(--ink-2)}
td.cov.short{background:var(--crit-soft);color:var(--crit);font-weight:700}
td.cov.met{color:var(--ok)}
td.cov.over{color:var(--amber)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px}

/* Popover */
#pop{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.25);padding:12px;width:290px;display:grid;gap:10px}
#pop .shifts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#pop .shifts button{border:0;border-radius:8px;padding:8px 4px;color:#fff;cursor:pointer;font-weight:600;font-size:13px;line-height:1.2}
#pop .shifts button small{display:block;font-weight:400;font-size:11px;opacity:.9}
#pop .shifts button.alt{background:var(--surface-2);color:var(--ink)}
#pop .shifts button.sel{outline:3px solid var(--ink);outline-offset:1px}
#pop .warns{font-size:12px;color:var(--crit)}

/* Tables */
table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
table.list td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list tr.inactive td{opacity:.5}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface-2)}
.pill.pending{background:#FFF0CC;color:#7A4E00}
.pill.approved{background:var(--ok-soft);color:var(--ok)}
.pill.denied{background:var(--crit-soft);color:var(--crit)}
.swatch{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}

/* Day sheet */
.daygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.daygrid .card h3{font-size:16px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.daygrid ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.daygrid li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
.daygrid li:last-child{border-bottom:0}
.need{color:var(--crit);font-weight:600}

/* Open shifts */
.open{display:grid;gap:8px}
.open .item{display:grid;grid-template-columns:minmax(200px,280px) 1fr;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.open .cands{display:flex;gap:6px;flex-wrap:wrap}
.cand{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:4px 10px;font-size:13px;cursor:pointer}
.cand:hover{border-color:var(--accent)}
.cand.ot{border-style:dashed}
.cand small{color:var(--ink-2)}

/* Forms */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.form label{display:grid;gap:4px;font-size:13px;color:var(--ink-2);font-weight:500}
.form label.wide{grid-column:1/-1}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{font-size:18px;margin-bottom:14px}
dialog .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
table.targets input{width:58px;text-align:center}
table.targets td,table.targets th{padding:4px 6px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-size:14px;max-width:calc(100vw - 32px)}

@media (max-width:700px){
  .open .item{grid-template-columns:1fr}
  table.grid .name{min-width:130px}
}
@media print{
  @page{size:landscape;margin:8mm}
  header.top,.toolbar,.noprint,#pop,.legend .noprint{display:none !important}
  body{background:#fff;color:#000;font-size:11px}
  main{padding:0}
  .gridwrap{max-height:none;overflow:visible;border:0}
  table.grid{font-size:10px}
  table.grid td.c{height:22px;width:auto;min-width:0}
  table.grid thead th,table.grid .name{position:static}
  .printhead{display:block !important;margin-bottom:6px}
}
.printhead{display:none}
</style>
</head>
<body>

<section id="lock">
  <form id="lockform">
    <div class="mark"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M12 12v6M9 15h6"/></svg></div>
    <div>
      <h1 style="font-size:24px">The Pines HC Scheduling</h1>
      <p class="muted" style="margin:6px 0 0">Nursing department staff schedule. Password required.</p>
    </div>
    <input id="pw" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required autofocus>
    <label class="row muted" style="font-size:14px"><input type="checkbox" id="remember" style="width:auto"> Keep me signed in on this device</label>
    <button class="btn primary" id="unlock" style="justify-content:center">Unlock</button>
    <p class="err" id="lockerr" role="alert"></p>
  </form>
</section>

<div id="app" class="hidden">
  <header class="top">
    <h1><span class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M12 12v6M9 15h6"/></svg></span><span id="facility">The Pines HC Scheduling</span></h1>
    <nav class="tabs" id="tabs">
      <button data-v="schedule" class="on">Schedule</button>
      <button data-v="day">Day Sheet</button>
      <button data-v="open">Open Shifts</button>
      <button data-v="staff">Staff</button>
      <button data-v="requests">Time Off</button>
      <button data-v="settings">Settings</button>
    </nav>
    <span class="spacer"></span>
    <span class="sync" id="sync"><span class="dot"></span><span id="synctext">Loading…</span></span>
    <button class="btn sm" id="lockbtn" title="Lock">Lock</button>
  </header>
  <main>
    <div id="banner"></div>
    <section class="view" id="v-schedule"></section>
    <section class="view hidden" id="v-day"></section>
    <section class="view hidden" id="v-open"></section>
    <section class="view hidden" id="v-staff"></section>
    <section class="view hidden" id="v-requests"></section>
    <section class="view hidden" id="v-settings"></section>
  </main>
</div>

<div id="pop" class="hidden" role="dialog" aria-label="Assign shift"></div>
<dialog id="dlg"></dialog>

<script>
'use strict';
// The Pines HC Scheduling: a single-page staff scheduler for the nursing
// department. The schedule is stored AES-256-GCM encrypted in a GitHub repo, so
// the repo (and this page) only ever hold ciphertext. Anyone with the password
// can view; editing also needs a GitHub token that can write to that repo.

const CFG = { owner: 'granviladmin-lab', repo: 'pines-hc-scheduling', branch: 'main', path: 'data/schedule.enc' };
const LOCK = {"iter":600000,"salt":"Y0/gu9DZgB7t9yJNYZdzww==","iv":"gitURClZtIGd7kHe","ct":"J5qvPVwlLlKeSI8mKV7aP+2/dZtC3vZYrWAE"}; // { iter, salt, iv, ct }: the password check, written by build.mjs

const $ = (id) => document.getElementById(id);
const LS = {
  get(k) { try { return localStorage.getItem('hcs.' + k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem('hcs.' + k) : localStorage.setItem('hcs.' + k, v); } catch {} },
};

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (v === true) e.setAttribute(k, '');
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : String(c));
  return e;
}
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);

function toast(msg, ms = 2600) {
  const t = el('div', { class: 'toast', role: 'status', text: msg });
  document.body.append(t);
  setTimeout(() => t.remove(), ms);
}

// ---------- Dates (plain 'YYYY-MM-DD' strings, computed in UTC so DST never shifts a day)
const D = {
  parse: (s) => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); },
  fmt: (t) => new Date(t).toISOString().slice(0, 10),
  add: (s, n) => D.fmt(D.parse(s) + n * 86400000),
  dow: (s) => new Date(D.parse(s)).getUTCDay(),
  diff: (a, b) => Math.round((D.parse(b) - D.parse(a)) / 86400000),
  today: () => { const n = new Date(); return D.fmt(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate())); },
  label: (s, o = { weekday: 'short', month: 'short', day: 'numeric' }) => new Date(D.parse(s)).toLocaleDateString(undefined, { ...o, timeZone: 'UTC' }),
};
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const mins = (hhmm) => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };
const fmtTime = (hhmm) => {
  const [h, m] = hhmm.split(':').map(Number);
  const ap = h < 12 ? 'a' : 'p';
  const h12 = h % 12 || 12;
  return m ? `${h12}:${String(m).padStart(2, '0')}${ap}` : `${h12}${ap}`;
};

// ---------- Crypto
const b64 = { enc: (u) => btoa(String.fromCharCode(...new Uint8Array(u))), dec: (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0)) };
function b64big(u8) { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }

async function deriveKey(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64.dec(LOCK.salt), iterations: LOCK.iter, hash: 'SHA-256' }, base,
    { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
}
async function checkKey(key) {
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64.dec(LOCK.iv) }, key, b64.dec(LOCK.ct));
  return new TextDecoder().decode(pt) === 'pines-hc-ok';
}
async function gzip(bytes, dir) {
  if (typeof CompressionStream === 'undefined') return null;
  const s = new Blob([bytes]).stream().pipeThrough(dir === 'c' ? new CompressionStream('gzip') : new DecompressionStream('gzip'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function seal(obj) {
  let bytes = new TextEncoder().encode(JSON.stringify(obj));
  const z = await gzip(bytes, 'c');
  if (z) bytes = z;
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, KEY, bytes));
  return JSON.stringify({ v: 1, z: z ? 1 : 0, iv: b64.enc(iv), ct: b64big(ct) });
}
async function open_(text) {
  const env = JSON.parse(text);
  let bytes = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64.dec(env.iv) }, KEY, b64.dec(env.ct)));
  if (env.z) {
    const u = await gzip(bytes, 'd');
    if (!u) throw new Error('This browser is too old to open the schedule.');
    bytes = u;
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}

// ---------- Data model
// Everything is a map keyed by id, so edits from two schedulers merge cleanly.
function defaults() {
  return {
    v: 1,
    settings: { facility: 'The Pines HC Scheduling', anchor: '2026-10-18', periodDays: 14, otWeekly: 40, minRest: 8, allowFloat: true },
    windows: { D: { name: 'Day', order: 1 }, E: { name: 'Evening', order: 2 }, N: { name: 'Night', order: 3 } },
    roles: {
      RN: { name: 'RN', title: 'Registered Nurse', order: 1 },
      LPN: { name: 'LPN', title: 'Licensed Practical Nurse', order: 2 },
      CNA: { name: 'CNA', title: 'Certified Nursing Assistant', order: 3 },
      CMA: { name: 'CMA', title: 'Medication Aide', order: 4 },
    },
    units: { hc: { name: 'Health Care Center', order: 1 } },
    shifts: {
      D: { code: 'D', name: 'Day', start: '07:00', end: '15:00', unpaid: 30, color: '#D98A12', covers: ['D'], order: 1 },
      E: { code: 'E', name: 'Evening', start: '15:00', end: '23:00', unpaid: 30, color: '#7B4FD6', covers: ['E'], order: 2 },
      N: { code: 'N', name: 'Night', start: '23:00', end: '07:00', unpaid: 30, color: '#2D4C9C', covers: ['N'], order: 3 },
      D12: { code: 'D12', name: 'Day 12', start: '07:00', end: '19:00', unpaid: 30, color: '#B5541B', covers: ['D'], order: 4 },
      N12: { code: 'N12', name: 'Night 12', start: '19:00', end: '07:00', unpaid: 30, color: '#1E3166', covers: ['N'], order: 5 },
    },
    targets: { hc: { D: { RN: 1, LPN: 1, CNA: 4, CMA: 1 }, E: { RN: 1, LPN: 1, CNA: 3, CMA: 1 }, N: { RN: 1, LPN: 0, CNA: 2, CMA: 0 } } },
    staff: {},
    assign: {},
    requests: {},

}
const sorted = (map) => Object.entries(map || {}).sort((a, b) => (a[1].order ?? 0) - (b[1].order ?? 0) || String(a[1].name).localeCompare(String(b[1].name)));

let KEY = null;
let DATA = null;
let FILESHA = null;    // the data file's blob sha on GitHub (for safe writes)
let OPS = [];          // edits not yet saved, replayed on top of a newer copy if someone else saved first
let saving = false, saveTimer = null, refreshTimer = null;

function getPath(obj, p) { return p.reduce((o, k) => (o == null ? undefined : o[k]), obj); }
function setPath(obj, p, v) {

    o = o[p[i]];

  // Drop empty day maps so the file stays small.

}
function note(msg) {

// ---------- Schedule math
function shiftHours(sh) {
  let len = mins(sh.end) - mins(sh.start);
  if (len <= 0) len += 1440;
  return Math.max(0, len - (sh.unpaid || 0)) / 60;
}
function shiftSpan(date, sh) {
  const s = D.parse(date) + mins(sh.start) * 60000;
  let e = D.parse(date) + mins(sh.end) * 60000;
  if (e <= s) e += 86400000;
  return [s, e];
}
const a = (date, sid) => DATA.assign[date]?.[sid];
const isWork = (x) => x && DATA.shifts[x.s];
function weekStart(date) { return D.add(date, -D.dow(date)); }
function hoursBetween(sid, from, toExcl) {
  let h = 0;
  for (let d = from; d < toExcl; d = D.add(d, 1)) { const x = a(d, sid); if (isWork(x)) h += shiftHours(DATA.shifts[x.s]); }
  return h;
}
function periodStartFor(date) {
  const st = DATA.settings;
  const n = Math.floor(D.diff(st.anchor, date) / st.periodDays);
  return D.add(st.anchor, n * st.periodDays);
}
function targetFor(staff, days) {
  const t = Number(staff.hours) || 0; // hours per pay period
  return t * days / DATA.settings.periodDays;
}
function unitOf(sid, date) { return a(date, sid)?.u || DATA.staff[sid]?.unit; }
function offRequested(sid, date) {
  return Object.values(DATA.requests).find((r) => r.staff === sid && r.status !== 'denied' && r.from <= date && date <= (r.to || r.from));
}

// Problems with one person's shift on one date.
function warningsFor(sid, date, shiftId = a(date, sid)?.s) {
  const sh = DATA.shifts[shiftId];
  if (!sh) return [];
  const out = [];
  const [s, e] = shiftSpan(date, sh);
  for (const d of [D.add(date, -1), D.add(date, 1)]) {
    const x = a(d, sid);
    if (!isWork(x)) continue;
    const [s2, e2] = shiftSpan(d, DATA.shifts[x.s]);
    const gap = d < date ? (s - e2) / 3600000 : (s2 - e) / 3600000;
    if (gap < 0) out.push(`Overlaps the ${DATA.shifts[x.s].name} shift on ${D.label(d)}`);
    else if (gap < DATA.settings.minRest) out.push(`Only ${gap} h rest ${d < date ? 'after' : 'before'} the ${DATA.shifts[x.s].name} shift on ${D.label(d)}`);
  }
  const ws = weekStart(date);
  const wk = hoursBetween(sid, ws, D.add(ws, 7)) + (a(date, sid)?.s === shiftId ? 0 : shiftHours(sh));
  if (wk > DATA.settings.otWeekly) out.push(`${wk} h that week (overtime over ${DATA.settings.otWeekly})`);
  const r = offRequested(sid, date);
  if (r) out.push(`Asked for this day off (${r.status})`);
  const st = DATA.staff[sid];
  if (st && !st.active) out.push('Inactive staff member');
  return out;
}

// How many of a role work a coverage window on a date, in a unit (or all units).
function coverage(date, win, role, unit) {
  let n = 0;
  for (const [sid, x] of Object.entries(DATA.assign[date] || {})) {
    const st = DATA.staff[sid];
    if (!st || st.role !== role || !isWork(x)) continue;
    if (!DATA.shifts[x.s].covers?.includes(win)) continue;
    if (unit !== 'all' && (x.u || st.unit) !== unit) continue;
    n++;
  }
  return n;
}
function need(win, role, unit) {
  if (unit === 'all') return Object.keys(DATA.units).reduce((t, u) => t + (Number(DATA.targets[u]?.[win]?.[role]) || 0), 0);
  return Number(DATA.targets[unit]?.[win]?.[role]) || 0;
}
function shortfalls(from, days, unit) {
  const out = [];
  const units = unit === 'all' ? Object.keys(DATA.units) : [unit];
  for (let i = 0; i < days; i++) {
    const d = D.add(from, i);
    for (const u of units) for (const [w] of sorted(DATA.windows)) for (const [r] of sorted(DATA.roles)) {
      const missing = need(w, r, u) - coverage(d, w, r, u);
      if (missing > 0) out.push({ date: d, unit: u, win: w, role: r, missing });
    }
  }
  return out;
}
function shiftForWindow(win) {
  const list = sorted(DATA.shifts).filter(([, s]) => s.covers?.includes(win));
  return (list.find(([, s]) => s.covers.length === 1 && shiftHours(s) <= 8.5) || list[0] || [])[0];
}
// Who could fill a gap, best first.
function candidates(date, win, role, unit, shiftId = shiftForWindow(win)) {
  const sh = DATA.shifts[shiftId];
  if (!sh) return [];
  const ps = periodStartFor(date);
  const out = [];
  for (const [sid, st] of Object.entries(DATA.staff)) {
    if (!st.active || st.role !== role) continue;
    if (!DATA.settings.allowFloat && unit !== 'all' && st.unit !== unit) continue;
    if (a(date, sid)) continue;
    if (offRequested(sid, date)) continue;
    const w = warningsFor(sid, date, shiftId).filter((x) => !x.includes('overtime'));
    if (w.length) continue;
    const ws = weekStart(date);
    const wk = hoursBetween(sid, ws, D.add(ws, 7)) + shiftHours(sh);
    const per = hoursBetween(sid, ps, D.add(ps, DATA.settings.periodDays));
    const gap = (Number(st.hours) || 0) - per;
    out.push({ sid, st, ot: wk > DATA.settings.otWeekly, per, gap, home: st.unit === unit });
  }
  const typeRank = { FT: 0, PT: 1, PRN: 2 };
  out.sort((x, y) => x.ot - y.ot || y.home - x.home || (y.gap > 0) - (x.gap > 0) || (typeRank[x.st.type] ?? 1) - (typeRank[y.st.type] ?? 1) || y.gap - x.gap || x.st.name.localeCompare(y.st.name));
  return out.map((c) => ({ ...c, shiftId }));
}

// ---------- GitHub storage
async function gh(path, opts = {}) {
  const h = { Accept: 'application/vnd.github+json', ...(opts.headers || {}) };
  const tok = LS.get('token');
  if (tok) h.Authorization = 'Bearer ' + tok;
  return fetch('https://api.github.com' + path, { ...opts, headers: h, cache: 'no-store' });
}
async function fetchRemote() {
  const { owner, repo, branch, path } = CFG;
  if (LS.get('token')) {
    const r = await gh(`/repos/${owner}/${repo}/contents/${path}?ref=${branch}&t=${Date.now()}`);
    if (r.status === 404) return { text: null, sha: null };
    if (r.status === 401) throw new Error('The GitHub token was refused. Check it in Settings.');
    if (!r.ok) throw new Error(`GitHub said ${r.status}`);
    const j = await r.json();
    let text;
    if (j.content) text = atob(j.content.replace(/\n/g, ''));
    else text = await (await fetch(j.download_url, { cache: 'no-store' })).text();
    return { text, sha: j.sha };
  }
  // Viewers: find the newest commit, then read the file at that commit (no CDN staleness).
  let ref = branch;
  try {
    const r = await gh(`/repos/${owner}/${repo}/commits/${branch}`, { headers: { Accept: 'application/vnd.github.sha' } });
    if (r.ok) ref = (await r.text()).trim();
  } catch {}
  const r = await fetch(`https://raw.githubusercontent.com/${owner}/${repo}/${ref}/${path}`, { cache: 'no-store' });
  if (r.status === 404) return { text: null, sha: null };
  if (!r.ok) throw new Error(`GitHub said ${r.status}`);
  return { text: await r.text(), sha: null };
}

async function load({ quiet } = {}) {
  setSync('busy', 'Loading…');
  try {
    const { text, sha } = await fetchRemote();
    const remote = text ? await open_(text) : defaults();
    FILESHA = sha;
    DATA = remote;
    for (const op of OPS) setPath(DATA, op.p, op.v);
    migrate();
    persistDraft();
    setSync(OPS.length ? 'busy' : 'ok', OPS.length ? 'Unsaved changes' : (text ? `Up to date ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}` : 'New schedule (not saved yet)'));
    if (OPS.length) scheduleSave();
  } catch (e) {
    if (!DATA) {
      const draft = await loadDraft();
      DATA = draft || defaults();
      migrate();
    }
    setSync('bad', 'Offline: ' + (e.message || e));
    if (!quiet) toast("Couldn't load the latest schedule. Showing the copy saved on this device.");
  }
  render();
}

function scheduleSave() {
  setSync('busy', 'Unsaved changes');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 1500);
}
async function save() {
  if (saving) { scheduleSave(); return; }
  if (!OPS.length || !canEdit()) return;
  saving = true;
  setSync('busy', 'Saving…');
  const { owner, repo, branch, path } = CFG;
  const sent = OPS.length;
  try {
    for (let attempt = 0; attempt < 3; attempt++) {
      // Keep the change log to the newest 400 entries.
      const ids = Object.keys(DATA.log || {}).sort();
      for (const id of ids.slice(0, Math.max(0, ids.length - 400))) delete DATA.log[id];
      DATA.updatedAt = new Date().toISOString();
      DATA.updatedBy = who();
      const body = { message: `Schedule update by ${who()}`, content: btoa(await seal(DATA)), branch };
      if (FILESHA) body.sha = FILESHA;
      const r = await gh(`/repos/${owner}/${repo}/contents/${path}`, { method: 'PUT', body: JSON.stringify(body), headers: { 'Content-Type': 'application/json' } });
      if (r.ok) {
        FILESHA = (await r.json()).content.sha;
        OPS = OPS.slice(sent);
        persistDraft();
        setSync(OPS.length ? 'busy' : 'ok', OPS.length ? 'Unsaved changes' : `Saved ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`);
        if (OPS.length) scheduleSave();
        return;
      }
      if (r.status === 409 || r.status === 422) {
        // Someone else saved first: take their copy and re-apply our edits on top.
        const { text, sha } = await fetchRemote();
        FILESHA = sha;
        if (text) {
          DATA = await open_(text);
          for (const op of OPS) setPath(DATA, op.p, op.v);
          migrate();
          render();
        }
        continue;
      }
      if (r.status === 401 || r.status === 403) throw new Error('The GitHub token cannot write to the schedule. Check it in Settings.');
      if (r.status === 404) throw new Error('The schedule repository was not found, or the token cannot see it.');
      throw new Error(`GitHub said ${r.status}`);
    }
    throw new Error('Kept colliding with other saves');
  } catch (e) {
    setSync('bad', 'Not saved: ' + (e.message || e));
  } finally {
    saving = false;
  }
}

// An encrypted copy on this device, so the schedule opens offline and unsaved edits survive a reload.

function migrate() {

    const ci = [...td.parentElement.querySelectorAll('td.c')].indexOf(td);

  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPop(td); return; }
  if (e.key === 'Escape') { closePop(); return; }
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); assign(td.dataset.sid, td.dataset.d, null); refocus(td); return; }

function copyPrevious(dates) {

      changes.push([d, sid, { ...x }]);

function autoFill() {
  const gaps = shortfalls(UI.start, UI.days, UI.unit).filter((g) => g.date >= D.today());
  let filled = 0, left = 0;
  const plan = [];
  for (const g of gaps) {
    for (let i = 0; i < g.missing; i++) {
      const c = candidates(g.date, g.win, g.role, g.unit).find((x) => !x.ot);
      if (!c) { left++; continue; }
      const val = { s: c.shiftId };
      if (g.unit !== c.st.unit) val.u = g.unit;
      setPath(DATA, ['assign', g.date, c.sid], val); // provisional, so the next pick sees it
      plan.push([g.date, c.sid, val]);
      filled++;
    }
  }
  for (const [d, sid] of plan) setPath(DATA, ['assign', d, sid], undefined);
  if (!plan.length) { toast('No one can fill these without overtime or a conflict.'); return; }
  if (!confirm(`Auto-fill ${filled} open ${filled === 1 ? 'spot' : 'spots'} from today on, without overtime?${left ? ` ${left} can't be filled automatically.` : ''} You can change any of them afterwards.`)) return;
  for (const [d, sid, val] of plan) edit(['assign', d, sid], val);
  note(`Auto-filled ${filled} open shifts`);
  render();
  toast(`Filled ${filled}.${left ? ` ${left} still open.` : ''}`);
}

function decide(id, status) {
  const r = DATA.requests[id];
  const st = DATA.staff[r.staff];
  edit(['requests', id, 'status'], status, `${status === 'approved' ? 'Approved' : 'Denied'} time off for ${st?.name} from ${D.label(r.from)}`);
  if (status === 'approved') {
    const conflicts = [];
    for (let d = r.from; d <= (r.to || r.from); d = D.add(d, 1)) {
      const x = a(d, r.staff);
      if (isWork(x)) conflicts.push(d);
      else if (r.kind === 'pto') edit(['assign', d, r.staff], { s: 'PTO' });
      else if (!x) edit(['assign', d, r.staff], { s: 'OFF' });
    }
    if (conflicts.length) toast(`${st?.name} is still scheduled on ${conflicts.map((d) => D.label(d)).join(', ')}. Change those shifts on the Schedule tab.`, 5000);
  }
  render();
}

function changeLog() {
  const items = Object.entries(DATA.log || {}).sort((x, y) => y[0].localeCompare(x[0])).slice(0, 60);
  if (!items.length) return el('p', { class: 'muted', text: 'No changes yet.' });

    items.map(([, l]) => el('li', {}, el('span', { class: 'muted', text: `${new Date(l.at).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })} · ${l.by} · ` }), l.msg)));

// Clearly fake people, to try the app out. Delete them before real use.
function loadSample() {
  if (!confirm('Add 16 sample staff members (named "Sample …") and two weeks of sample shifts? Remove them before real use.')) return;
  const u = Object.keys(DATA.units)[0];
  const people = [['RN', 4], ['LPN', 3], ['CNA', 7], ['CMA', 2]];
  const ids = [];
  for (const [role, n] of people) for (let i = 1; i <= n; i++) {
    const id = uid();
    ids.push([id, role, i]);
    edit(['staff', id], { name: `Sample ${role} ${i}`, role, type: i === n ? 'PRN' : i === n - 1 ? 'PT' : 'FT', unit: u, hours: i === n ? 0 : i === n - 1 ? 48 : 80, phone: '', notes: 'Sample — delete before real use', active: true });
  }
  const ps = periodStartFor(D.today());
  const order = ['D', 'D', 'E', 'E', 'N', 'N', 'D', 'E'];
  for (const [id, role, i] of ids) {
    for (let k = 0; k < DATA.settings.periodDays; k++) {
      if ((k + i) % 7 === 5 || (k + i) % 7 === 6) continue;
      if (DATA.staff[id].type === 'PRN') continue;
      if (DATA.staff[id].type === 'PT' && k % 2) continue;
      const s = order[(i + role.length) % order.length];
      if (DATA.shifts[s]) edit(['assign', D.add(ps, k), id], { s });
    }
  }
  note('Loaded sample staff');
  render();
  toast('Sample staff added.');
}

// ---------- Unlock
async function unlockWith(key) {
  KEY = key;
  $('lock').classList.add('hidden');
  $('app').classList.remove('hidden');
  const draft = await loadDraft();
  if (draft) { DATA = draft; migrate(); render(); }
  await load({ quiet: !!draft });
  clearInterval(refreshTimer);
  // Viewers (and idle editors) pick up other people's changes every two minutes.
  refreshTimer = setInterval(() => { if (!OPS.length && !saving && document.visibilityState === 'visible' && !$('dlg').open && $('pop').classList.contains('hidden')) load({ quiet: true }); }, 120000);
}

$('lockform').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('unlock'), err = $('lockerr');
  btn.disabled = true; btn.textContent = 'Unlocking…'; err.textContent = '';
  try {
    if (!LOCK) throw new Error('not built');
    const key = await deriveKey($('pw').value);
    if (!(await checkKey(key))) throw new Error('bad');
    if ($('remember').checked) LS.set('key', b64.enc(await crypto.subtle.exportKey('raw', key)));
    $('pw').value = '';
    await unlockWith(key);
  } catch (e2) {
    err.textContent = e2.message === 'not built' ? 'This page was not built with a password.' : 'Incorrect password.';
  }
  btn.disabled = false; btn.textContent = 'Unlock';
});
$('lockbtn').addEventListener('click', () => {
  LS.set('key', null);
  location.reload();
});
$('tabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) show(b.dataset.v); });
window.addEventListener('beforeunload', (e) => { if (OPS.length) { e.preventDefault(); e.returnValue = ''; } });

(async () => {
  const saved = LS.get('key');
  if (saved && LOCK) {
    try {
      const key = await crypto.subtle.importKey('raw', b64.dec(saved), 'AES-GCM', true, ['encrypt', 'decrypt']);
      if (await checkKey(key)) { await unlockWith(key); return; }
    } catch {}
    LS.set('key', null);
  }
})();
