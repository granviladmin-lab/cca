<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Vibe Coding Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --surface-2:#E8ECF1; --ink:#0E1822; --ink-2:#4A5866; --line:#D5DCE3;
  --accent:#2750E8; --accent-ink:#FFFFFF; --accent-soft:#DDE5FF; --amber:#D98A12; --ok:#16935B; --crit:#C9392F;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1118; --surface:#121B25; --surface-2:#18232F; --ink:#E8EEF4; --ink-2:#98A7B6; --line:#243241;
    --accent:#6F8CFF; --accent-ink:#0B1118; --accent-soft:#1B2650; --amber:#F2B03E; --ok:#3CC98A; --crit:#FF6B5E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1118; --surface:#121B25; --surface-2:#18232F; --ink:#E8EEF4; --ink-2:#98A7B6; --line:#243241;
  --accent:#6F8CFF; --accent-ink:#0B1118; --accent-soft:#1B2650; --amber:#F2B03E; --ok:#3CC98A; --crit:#FF6B5E;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);line-height:1.1;letter-spacing:-.02em;margin:0;text-wrap:balance}
a{color:var(--accent)}
code{font-family:var(--mono);font-size:.86em;background:var(--surface-2);padding:1px 6px;border-radius:5px;overflow-wrap:anywhere}
kbd{font-family:var(--mono);font-size:.8em;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;background:var(--surface)}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.mono{font-family:var(--mono)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 .9rem var(--body);padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);text-decoration:none;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.6;cursor:wait}

/* ---------- lock ---------- */
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
#login form{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;display:flex;flex-direction:column;gap:14px}
#login h1{font-size:1.5rem}
#login p{margin:0;color:var(--ink-2);font-size:.92rem}
#login input{font:inherit;color:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
#login .primary{justify-content:center;padding:11px}
#err{color:var(--crit);min-height:1.3em;font-size:.9rem}
#login a{color:var(--ink-2);font-size:.9rem}

/* ---------- app bar ---------- */
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .back{color:var(--ink-2);text-decoration:none;font-size:.9rem;white-space:nowrap}
.bar .back:hover{color:var(--ink)}
.bar .sp{flex:1}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px;background:var(--surface)}
.tabs button{font:600 .88rem var(--body);border:0;background:transparent;color:var(--ink-2);padding:6px 14px;border-radius:6px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.deck-ctl{display:flex;align-items:center;gap:8px}
.deck-ctl .count{font-family:var(--mono);font-size:.85rem;color:var(--ink-2);min-width:4.5em;text-align:center}

/* ---------- guide ---------- */
#guide{max-width:780px;margin:0 auto;padding:40px 0 96px;padding-inline:16px}
#guide .doc-head{display:flex;flex-direction:column;gap:12px;padding-bottom:28px;border-bottom:1px solid var(--line)}
#guide h1{font-size:clamp(2rem,5vw,2.9rem);font-weight:800}
#guide .lede{font-size:1.12rem;color:var(--ink-2);margin:0}
#guide .meta{margin:0;color:var(--ink-2);font-size:.82rem}
#guide section{padding-top:36px}
#guide h2{font-size:1.6rem;margin-bottom:12px;display:flex;align-items:center;gap:12px}
#guide .step{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:1.05rem;flex:none}
#guide p,#guide li{color:var(--ink)}
#guide ol,#guide ul{padding-left:1.3em}
#guide li{margin:6px 0}
.tbl{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.94rem}
th,td{text-align:left;vertical-align:top;padding:10px 14px;border-bottom:1px solid var(--line)}
th{font-weight:600;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
.diagram{margin:20px 0;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.diagram svg{display:block;width:100%;height:auto}
.diagram figcaption{font-size:.9rem;color:var(--ink-2);padding:4px 12px 8px}
.callout{border-left:3px solid var(--amber);background:color-mix(in srgb,var(--amber) 10%,transparent);padding:12px 16px;border-radius:0 8px 8px 0}
ul.checks{list-style:none;padding:0}
ul.checks label{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;border:1px solid var(--line);border-radius:9px;background:var(--surface);cursor:pointer}
ul.checks input{margin-top:5px;accent-color:var(--accent);width:17px;height:17px;flex:none}
ul.checks input:checked + span{color:var(--ink-2);text-decoration:line-through}

/* ---------- deck ---------- */
#deck{position:relative;height:calc(100vh - 58px);overflow:hidden;background:var(--surface-2)}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}
.slide{position:absolute;inset:0;display:none;flex-direction:column;gap:22px;padding:64px 88px;background:var(--surface);border-radius:14px;box-shadow:0 1px 0 var(--line),0 12px 40px rgba(14,24,34,.10);overflow:hidden}
.slide.on{display:flex}
.slide::after{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--accent)}
.slide .eyebrow{font-size:15px}
.slide h2{font-size:48px;font-weight:700;max-width:24ch}
.slide p,.slide li{font-size:24px;line-height:1.45}
.slide code{font-size:.82em}
.slide .note{margin-top:auto;color:var(--ink-2);font-size:21px;border-top:1px solid var(--line);padding-top:18px}
.slide .note.warn{color:var(--ink);border-top-color:var(--amber)}
.slide .dim{color:var(--ink-2);font-size:.85em}
.slide .num{position:absolute;right:40px;bottom:28px;font-family:var(--mono);font-size:14px;color:var(--ink-2)}
.title-slide{justify-content:center;background:radial-gradient(circle at 85% 20%,var(--accent-soft),transparent 55%),var(--surface)}
.title-slide h1{font-size:76px;font-weight:800;max-width:16ch}
.title-slide .sub{font-size:28px;color:var(--ink-2);margin:0;max-width:40ch}
.title-slide .foot{position:absolute;left:88px;bottom:48px;margin:0;font-size:16px;color:var(--ink-2)}
.loop-chips{display:flex;align-items:center;gap:14px;margin-top:18px}
.loop-chips span{font:600 22px var(--body);padding:10px 20px;border-radius:99px;border:1.5px solid var(--accent);color:var(--ink);background:var(--surface)}
.loop-chips i{font-style:normal;color:var(--ink-2);font-size:24px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:12px}
.card{border:1px solid var(--line);border-radius:12px;padding:26px 28px;background:var(--bg);display:flex;flex-direction:column;gap:10px}
.card h3{font-size:28px}
.card p{margin:0;font-size:21px}
.card.accent{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.vs{display:grid;grid-template-columns:1fr 1.6fr;gap:24px}
.vs>div{border-radius:12px;padding:22px 26px}
.vs h3{font:600 15px var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.vs p{margin:0;font-size:22px}
.weak{border:1px dashed var(--line);color:var(--ink-2)}
.weak h3{color:var(--crit)}
.strong{border:2px solid var(--ok);background:color-mix(in srgb,var(--ok) 7%,var(--surface))}
.strong h3{color:var(--ok)}
ul.ticks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
ul.ticks li{position:relative;padding-left:36px;font-size:22px}
ul.ticks li::before{content:"";position:absolute;left:4px;top:.5em;width:14px;height:14px;border-radius:4px;background:var(--accent)}
ul.ticks.big li{font-size:25px}
ul.ticks.big{gap:16px;margin-top:8px}
ul.plain{margin:0;padding-left:1.1em}
ul.plain li{font-size:21px;margin:4px 0}
ol.steps{margin:6px 0 0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:16px}
ol.steps li{counter-increment:s;position:relative;padding-left:58px;font-size:24px;min-height:38px}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:-1px;display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:700 20px var(--display)}
ol.steps.compact{gap:13px}
ol.steps.compact li{font-size:22px}
ol.steps b{display:inline-block;min-width:4.6em;margin-right:10px}
.big-loop{width:100%;height:auto;margin-top:8px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:10px}
.keys div{border:1px solid var(--line);border-radius:12px;padding:22px 20px;background:var(--bg);display:flex;flex-direction:column;align-items:flex-start;gap:12px;font-size:24px}
.keys b{font-weight:400;white-space:nowrap}
.keys span{font-size:18px;color:var(--ink-2)}
.keys kbd{font-size:20px}
.deck-nav{position:absolute;inset:0;display:flex;pointer-events:none}
.deck-nav button{pointer-events:auto;flex:0 0 18%;border:0;background:transparent;cursor:pointer;opacity:0}
.deck-nav .gap{flex:1}
#deck:fullscreen{height:100vh;background:#000}
@media (max-width:640px){.bar .title{display:none}}

/* ---------- print: the deck one slide per page ---------- */
@media print{
  @page{size:1280px 720px;margin:0}
  body{background:#fff}
  .bar,#guide,.deck-nav{display:none!important}
  #deck{height:auto;overflow:visible;background:none}
  #stage{position:static;transform:none!important;width:1280px;height:auto}
  .slide{position:relative;display:flex!important;width:1280px;height:720px;border-radius:0;box-shadow:none;break-after:page}
  body.print-guide #guide{display:block!important}
  body.print-guide #deck{display:none!important}
}
</style>
</head>

</div>

</div>

const $ = (id) => document.getElementById(id);
const u8 = (b) => Uint8Array.from(atob(b), (c) => c.charCodeAt(0));
let data = null, ver = 'v2', mode = 'guide', slides = [], cur = 0;
const VER = 'cca.training.ver';

function fit() {
  const deck = $('deck'), s = Math.min(deck.clientWidth / 1340, deck.clientHeight / 780);
  $('stage').style.transform = `translate(-50%,-50%) scale(${s})`;
}
function go(i) {
  cur = Math.max(0, Math.min(slides.length - 1, i));
  slides.forEach((el, k) => el.classList.toggle('on', k === cur));
  $('count').textContent = `${cur + 1} / ${slides.length}`;
  history.replaceState(null, '', `#${ver}/slides/${cur + 1}`);
}
function view(which) {
  mode = which;
  const deck = which === 'deck';
  $('tabGuide').setAttribute('aria-selected', String(!deck));
  $('tabDeck').setAttribute('aria-selected', String(deck));
  $('guide').hidden = deck; $('deck').hidden = !deck; $('deckCtl').hidden = !deck; $('gpdf').hidden = deck;
  if (deck) { fit(); go(cur); } else history.replaceState(null, '', `#${ver}/guide`);
}
function load(v, which, slide) {
  ver = v === 'v1' ? 'v1' : 'v2';
  try { localStorage.setItem(VER, ver); } catch {}
  $('verV1').setAttribute('aria-selected', String(ver === 'v1'));
  $('verV2').setAttribute('aria-selected', String(ver === 'v2'));
  document.title = ver === 'v1' ? 'Vibe Coding Training' : 'Vibe Coding for Beginners';
  $('guide').innerHTML = data[ver].guide;
  $('stage').innerHTML = data[ver].deck;
  slides = [...document.querySelectorAll('#stage .slide')];
  slides.forEach((el, k) => { const n = document.createElement('span'); n.className = 'num'; n.textContent = `${k + 1} / ${slides.length}`; el.appendChild(n); });
  cur = Math.max(0, (slide || 1) - 1);
  scrollTo(0, 0);
  view(which);
}
function start(d) {
  data = d;
  $('login').hidden = true; $('app').hidden = false;
  const m = location.hash.match(/^#(v[12])?\/?(slides|guide)?(?:\/(\d+))?/) || [];
  let saved = null; try { saved = localStorage.getItem(VER); } catch {}
  load(m[1] || saved || 'v2', m[2] === 'slides' ? 'deck' : 'guide', Number(m[3]) || 1);
}

$('verV1').onclick = () => load('v1', mode);
$('verV2').onclick = () => load('v2', mode);
$('tabGuide').onclick = () => view('guide');
$('tabDeck').onclick = () => view('deck');
$('prev').onclick = $('hitPrev').onclick = () => go(cur - 1);
$('next').onclick = $('hitNext').onclick = () => go(cur + 1);
$('full').onclick = () => { const d = $('deck'); document.fullscreenElement ? document.exitFullscreen() : d.requestFullscreen?.(); };
$('pdf').onclick = () => { document.body.classList.remove('print-guide'); print(); };
$('gpdf').onclick = () => { document.body.classList.add('print-guide'); print(); };
addEventListener('resize', () => { if (!$('deck').hidden) fit(); });
document.addEventListener('fullscreenchange', () => setTimeout(fit, 50));
document.addEventListener('keydown', (e) => {
  if ($('deck').hidden || e.target.tagName === 'INPUT') return;
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(cur + 1); }
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(cur - 1); }
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(slides.length - 1);
  else if (e.key === 'f' || e.key === 'F') $('full').click();
});
let tx = null;
$('deck').addEventListener('touchstart', (e) => { tx = e.touches[0].clientX; }, { passive: true });
$('deck').addEventListener('touchend', (e) => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) go(cur + (dx < 0 ? 1 : -1)); tx = null; });

$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('go'), err = $('err');
  btn.disabled = true; btn.textContent = 'Unlocking…'; err.textContent = '';
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode($('pw').value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u8(D.salt), iterations: D.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const d = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(D.iv) }, key, u8(D.ct))));
    $('pw').value = '';
    start(d);
  } catch {
    err.textContent = 'Incorrect password.';
    btn.disabled = false; btn.textContent = 'Unlock';
  }
});
</script>
