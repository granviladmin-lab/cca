<title>Resident Underwriter</title>
<style>
:root { --bg:#f6f6f3; --panel:#fff; --ink:#1d2124; --muted:#666d72; --line:#dcdcd6; --accent:#2f5d50; --bad:#b23b3b; }
@media (prefers-color-scheme: dark) { :root { --bg:#15181a; --panel:#1e2224; --ink:#e7e9ea; --muted:#9aa2a7; --line:#33393c; --accent:#7fbfa9; --bad:#e57373; } }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
form { width:100%; max-width:360px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:28px; display:flex; flex-direction:column; gap:14px; }
h1 { font-size:18px; margin:0; }
p { margin:0; color:var(--muted); font-size:13px; }
input { font:inherit; color:inherit; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--bg); }
button { font:inherit; padding:9px; border-radius:8px; border:0; background:var(--accent); color:var(--panel); cursor:pointer; }
button:disabled { opacity:.6; cursor:wait; }
#err { color:var(--bad); min-height:1.2em; }
a { color:var(--muted); font-size:13px; }
</style>
</head>
