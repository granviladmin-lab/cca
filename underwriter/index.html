<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Resident Underwriter</title>
<style>
:root { --bg:#f6f6f3; --panel:#fff; --ink:#1d2124; --muted:#666d72; --line:#dcdcd6; --accent:#2f5d50; --accent-soft:#e2ece8; --bad:#b23b3b; --tag:#b07a2a; }
@media (prefers-color-scheme: dark) { :root { --bg:#15181a; --panel:#1e2224; --ink:#e7e9ea; --muted:#9aa2a7; --line:#33393c; --accent:#7fbfa9; --accent-soft:#23332e; --bad:#e57373; --tag:#e0aa55; } }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
.center { min-height:100vh; display:grid; place-items:center; padding:16px; }
.card { width:100%; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:28px; }
form.card { max-width:360px; display:flex; flex-direction:column; gap:14px; }
h1 { font-size:18px; margin:0; }
p { margin:0; color:var(--muted); font-size:13px; }
input { font:inherit; color:inherit; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--bg); }
button { font:inherit; cursor:pointer; }
.primary { padding:9px; border-radius:8px; border:0; background:var(--accent); color:var(--panel); }
.primary:disabled { opacity:.6; cursor:wait; }
#err { color:var(--bad); min-height:1.2em; }
a { color:var(--muted); font-size:13px; }
#chooser { display:none; }
#chooser .card { max-width:720px; display:flex; flex-direction:column; gap:18px; }
.options { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:600px) { .options { grid-template-columns:1fr; } }
.opt { text-align:left; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:18px; display:flex; flex-direction:column; gap:8px; }
.opt:hover, .opt:focus-visible { border-color:var(--accent); outline:none; background:var(--accent-soft); }
.opt.last { border-color:var(--accent); }
.opt strong { font-size:16px; display:flex; align-items:center; gap:8px; }
.opt ul { margin:0; padding-left:18px; color:var(--muted); font-size:13px; }
.tag { font-size:10px; font-weight:600; letter-spacing:.03em; background:var(--tag); color:var(--panel); border-radius:4px; padding:1px 6px; }
.row { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
#appbar { display:none; position:fixed; inset:0 0 auto 0; height:34px; align-items:center; gap:10px; padding:0 12px; background:var(--panel); border-bottom:1px solid var(--line); font-size:13px; z-index:2; }
#appbar .sp { flex:1; }
#appbar button { border:1px solid var(--line); background:var(--panel); color:inherit; border-radius:6px; padding:2px 10px; font-size:12px; }
#appbar button:hover { border-color:var(--accent); }
#app { display:none; position:fixed; top:34px; left:0; width:100%; height:calc(100% - 34px); border:0; background:var(--bg); }
@media print { #appbar { display:none !important; } #app { top:0; height:100%; } }
</style>
</head>
<body>
<div class="center" id="login">
<form class="card" id="f">
  <h1>Resident Underwriter</h1>
  <p>This client tool is password protected.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" autofocus required>
  <button class="primary" id="go">Unlock</button>
  <p id="err" role="alert"></p>
  <a href="../#services">← Back to services</a>
</form>
</div>

<div class="center" id="chooser">
<div class="card">
  <div class="row"><h1>Choose a version</h1><a href="../#services">← Back to services</a></div>
  <div class="options">
    <button class="opt" data-v="v1">
      <strong>Version 1</strong>
      <p>The original underwriter. Quick single-screen screening.</p>
      <ul><li>Single or couple, by age</li><li>Life insurance and LTC options</li><li>Approve / Review / Decline rating</li><li>Saved applicant portfolio</li></ul>
    </button>
    <button class="opt" data-v="v2">
      <strong>Version 2 <span class="tag">NEW</span></strong>
      <p>Full community setup with detailed reports.</p>
      <ul><li>Unit types, contracts, refunds, fee schedules</li><li>5-colour risk levels and guarantor amount</li><li>Grid of results and community assistance report</li><li>Calibrate to your life-expectancy study</li></ul>
    </button>
  </div>
  <p>Each version keeps its own saved applicants in this browser. v1 records can be exported from v1 and imported into v2.</p>
</div>
</div>

<div id="appbar"><strong>Resident Underwriter</strong><span id="which"></span><span class="sp"></span><button id="switch">Switch version</button></div>
<iframe id="app" title="Resident Underwriter"></iframe>

const u8 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const $ = (id) => document.getElementById(id);
const LAST = 'resident-underwriter.lastVersion';
let apps = null;

function show(view) {
  $('login').style.display = view === 'login' ? '' : 'none';
  $('chooser').style.display = view === 'chooser' ? 'grid' : 'none';
  $('appbar').style.display = view === 'app' ? 'flex' : 'none';
  $('app').style.display = view === 'app' ? 'block' : 'none';
}
function choose() {
  let last = null;
  try { last = localStorage.getItem(LAST); } catch {}
  document.querySelectorAll('.opt').forEach((b) => b.classList.toggle('last', b.dataset.v === last));
  $('app').removeAttribute('srcdoc');
  show('chooser');
  (document.querySelector('.opt.last') || document.querySelector('.opt')).focus();
}
function open(v) {
  try { localStorage.setItem(LAST, v); } catch {}
  $('which').textContent = v === 'v2' ? '· Version 2' : '· Version 1';
  $('app').srcdoc = apps[v];
  show('app');
}
document.querySelectorAll('.opt').forEach((b) => b.addEventListener('click', () => open(b.dataset.v)));
$('switch').addEventListener('click', choose);

$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('go'), err = $('err');
  btn.disabled = true; btn.textContent = 'Unlocking…'; err.textContent = '';
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode($('pw').value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u8(D.salt), iterations: D.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    apps = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(D.iv) }, key, u8(D.ct))));
    $('pw').value = '';
    choose();
  } catch {
    err.textContent = 'Incorrect password.';
    btn.disabled = false; btn.textContent = 'Unlock';
  }
});
</script>
